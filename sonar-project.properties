# SonarQube / SonarCloud Project Configuration
sonar.projectKey=Saaheeli
sonar.projectName=Saaheeli Web Application
sonar.projectVersion=1.0.0

# Source Code & Test File Paths
sonar.sources=src
sonar.tests=src/test
sonar.test.inclusions=src/test/**/*.test.ts,src/test/**/*.test.tsx

# Encoding & Exclusions
sonar.sourceEncoding=UTF-8
sonar.exclusions=**/node_modules/**,**/dist/**,**/coverage/**,**/*.config.ts,**/*.config.js
sonar.coverage.exclusions=src/test/**,src/mock/**,src/vite-env.d.ts

# Vitest LCOV Coverage Report Path
sonar.javascript.lcov.reportPaths=coverage/lcov.info

# TypeScript Configuration File
sonar.typescript.tsconfigPath=tsconfig.app.json
